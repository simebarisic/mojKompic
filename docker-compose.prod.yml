services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kompic
      POSTGRES_USER: kompic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kompic_db_data:/var/lib/postgresql/data

  app:
    image: ghcr.io/simebarisic/moj-kompic:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://kompic:${POSTGRES_PASSWORD}@db:5432/kompic
      PORT: 3001
      # Login (samo prava instanca - vidi server.js). Prazno/nepostavljeno =
      # bez prijave. Generiraj hash s "npm run hash-password".
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3001:3001"

volumes:
  kompic_db_data:
