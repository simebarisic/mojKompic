name: Build i push Docker image na GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/moj-kompic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Prijava na GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Priprema Docker Buildx-a
        uses: docker/setup-buildx-action@v3

      - name: Metapodaci za tagove
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build i push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Prijava na GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Povuci najnoviju sliku i podigni servise
        run: |
          docker compose --env-file /opt/moj-kompic/.env -f docker-compose.prod.yml pull
          docker compose --env-file /opt/moj-kompic/.env -f docker-compose.prod.yml up -d --remove-orphans

      - name: Počisti stare Docker slike
        run: docker image prune -f