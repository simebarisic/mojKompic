name: CI - build & push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Odredi tag za ovaj build
        id: vars
        run: echo "sha_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # PRILAGODI "context:" putanje tvom repou (npr. backend/, frontend/)
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ispiši tag za ovaj build (za ručni deploy)
        run: |
          echo "### Build gotov" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag za deploy: \`${{ steps.vars.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pokreni 'Deploy' workflow ručno (Actions tab) s ovim tagom, ili ostavi prazno za 'main'." >> "$GITHUB_STEP_SUMMARY"
