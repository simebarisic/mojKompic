name: CI - build & push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/simebarisic/moj-kompic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Odredi tag za ovaj build
        id: vars
        run: echo "sha_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ispiši tag za ovaj build (za ručni deploy)
        run: |
          echo "### Build gotov" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag za deploy: \`${{ steps.vars.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pokreni 'Deploy' workflow ručno (Actions tab) s ovim tagom, ili ostavi prazno za 'latest'." >> "$GITHUB_STEP_SUMMARY"